</linearGradient>
<filter id="footerSoft" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="10" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect x="0" y="0" width="900" height="130" rx="18" fill="url(#footerBg)"/>
