<svg width="900" height="130" viewBox="0 0 900 130" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  .quote { font-family: 'Segoe UI', Arial, sans-serif; font-style: italic; font-size: 17px; fill: #E6E6E6; }
  .attr { font-family: 'Fira Code',ui-monospace,monospace; font-size: 13px; letter-spacing: 2px; fill: #FF1A1A; }
  .corner { stroke: #FF1A1A; stroke-width: 2; fill: none; opacity: .8; }
</style>
<radialGradient id="footerBg" cx="50%" cy="15%" r="90%">
  <stop offset="0%" stop-color="#2a0d0d"/>
  <stop offset="45%" stop-color="#0D1117"/>
  <stop offset="100%" stop-color="#000000"/>
</radialGradient>
<radialGradient id="footerVig" cx="50%" cy="50%" r="75%">
  <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
  <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
</radialGradient>
<linearGradient id="footerFrame" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#FF1A1A"/>
