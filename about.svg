<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  .name { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; font-size: 28px; letter-spacing: 6px; fill: #ffffff; }
  .role { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 2px; fill: #FF6666; }
  .label { font-family: 'Fira Code','JetBrains Mono',ui-monospace,monospace; font-size: 12px; letter-spacing: 4px; fill: #FF6666; }
  .hint { font-family: 'Fira Code',ui-monospace,monospace; font-size: 11px; letter-spacing: 2px; fill: #FF6666; }
  .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #cbd5e1; }
  .corner { stroke: #FF1A1A; stroke-width: 2; fill: none; opacity: .8; }
  .grid { stroke: #FF1A1A; stroke-opacity: .06; stroke-width: 1; }
</style>
<radialGradient id="aboutBg" cx="50%" cy="15%" r="90%">
  <stop offset="0%" stop-color="#2a0d0d"/>
  <stop offset="45%" stop-color="#0D1117"/>
  <stop offset="100%" stop-color="#000000"/>
</radialGradient>
<radialGradient id="aboutVig" cx="50%" cy="50%" r="75%">
  <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
  <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
</radialGradient>
<linearGradient id="aboutFrame" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#FF1A1A"/>
  <stop offset="100%" stop-color="#990000"/>
</linearGradient>
<filter id="aboutGlow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="4" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="aboutSoft" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="10" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect x="0" y="0" width="900" height="400" rx="18" fill="url(#aboutBg)"/>
<rect x="0" y="0" width="900" height="400" rx="18" fill="url(#aboutVig)"/>
<g>
  <line class="grid" x1="0" y1="90" x2="900" y2="90"/>
  <line class="grid" x1="0" y1="200" x2="900" y2="200"/>
  <line class="grid" x1="0" y1="305" x2="900" y2="305"/>
</g>
<rect x="3" y="3" width="894" height="394" rx="16" fill="none" stroke="url(#aboutFrame)" stroke-width="5" opacity="0.22" filter="url(#aboutSoft)"/>
<rect x="3" y="3" width="894" height="394" rx="16" fill="none" stroke="url(#aboutFrame)" stroke-width="2" opacity="0.55"/>
<path class="corner" d="M24 60 L24 24 L60 24"/>
<path class="corner" d="M876 60 L876 24 L840 24"/>
<path class="corner" d="M24 340 L24 376 L60 376"/>
<path class="corner" d="M876 340 L876 376 L840 376"/>
<text x="450" y="58" text-anchor="middle" class="label">ABOUT ME</text>
<rect x="390" y="70" width="120" height="2" fill="#FF1A1A" filter="url(#aboutGlow)"/>
<text x="450" y="128" text-anchor="middle" class="name" filter="url(#aboutSoft)">ARGA</text>
<text x="450" y="154" text-anchor="middle" class="role">SOFTWARE ENGINEERING STUDENT — FRONT-END DEVELOPER</text>
<rect x="405" y="168" width="90" height="2" fill="#FF1A1A" filter="url(#aboutGlow)"/>
<text x="450" y="204" text-anchor="middle" class="desc">RPL student focused on Front-End Development and UI/UX.</text>
<text x="450" y="228" text-anchor="middle" class="desc">I build clean, modern, and responsive web interfaces, as well as Mobile UI</text>
<text x="450" y="252" text-anchor="middle" class="desc">with Flutter — learning through real projects and hands-on experience.</text>
<text x="450" y="292" text-anchor="middle" class="desc">Working toward becoming a professional Software Engineer</text>
<text x="450" y="316" text-anchor="middle" class="desc">building useful, user-centered products.</text>
<text x="450" y="356" text-anchor="middle" class="hint">REACT • FLUTTER • TYPESCRIPT • UI/UX</text>
</svg>
